name: Static Checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-14
        pip install cmake-format numpy matplotlib pylint mypy black
    
    - name: Check clang-format (C/C++)
      run: |
        # Check all .c, .h, .cpp, .hpp files
        find . \( -path "./external" -o -path "./build" \) -prune -o \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" \) -type f -exec clang-format-14 -i -style=file {} +
    
    - name: Check cmake-format (CMake files)
      run: |
        # Format CMakeLists.txt files in place
        find . -name CMakeLists.txt -type f ! -path "./build/*" ! -path "./.git/*" ! -path "./external/*" -exec cmake-format -i {} +
    
    - name: black (Python code formatting)
      run: |
        export PYTHONPATH="$PWD:$PYTHONPATH"
        black --line-length 120 faoc_utils test faoc.pyi

    - name: Run pylint (Python)
      run: |
        export PYTHONPATH="$PWD:$PYTHONPATH"
        pylint --disable=all --enable=E,F --disable=import-error --max-line-length=120 \
          faoc_utils/*.py \
          test/test_python_bindings.py
    
    - name: Run mypy (Python type checking)
      run: |
        export PYTHONPATH="$PWD:$PYTHONPATH"
        mypy --show-error-codes --ignore-missing-imports \
          faoc_utils/ \
          test/test_python_bindings.py

    - name: Check diffs
      run: |
        if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
          echo "CI checks produced repository changes. Please run checks locally and commit the result."
          git status --short
          git --no-pager diff
          exit 1
        fi
